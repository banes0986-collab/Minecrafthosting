<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MC Bot Panel</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --card: #16161f;
      --border: #2a2a3a;
      --accent: #00ff88;
      --accent2: #00ccff;
      --red: #ff4466;
      --text: #e0e0f0;
      --muted: #666680;
      --font: 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 24px;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent);
    }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    .dot.connected { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }

    .card h2 {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 4px;
      letter-spacing: 0.08em;
    }

    input, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.85rem;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent2);
    }

    .row { display: flex; gap: 10px; }
    .row .field { flex: 1; }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type=range] {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      padding: 0;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      cursor: pointer;
    }

    .slider-val {
      min-width: 36px;
      text-align: right;
      color: var(--accent);
      font-size: 0.9rem;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-family: var(--font);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .btn-start {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(0,255,136,0.3);
    }
    .btn-start:hover { box-shadow: 0 0 20px rgba(0,255,136,0.6); }
    .btn-start:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-stop {
      background: transparent;
      color: var(--red);
      border: 1px solid var(--red);
    }
    .btn-stop:hover { background: rgba(255,68,102,0.1); }
    .btn-stop:disabled { opacity: 0.4; cursor: not-allowed; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
    }

    .stat-num {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
      display: block;
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .console {
      background: #08080d;
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 320px;
      overflow-y: auto;
      padding: 12px;
      font-size: 0.75rem;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .log-line { margin-bottom: 2px; }
    .log-line.info { color: var(--accent2); }
    .log-line.success { color: var(--accent); }
    .log-line.error { color: var(--red); }
    .log-line.warn { color: #ffaa00; }
    .log-line.muted { color: var(--muted); }

    .bot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .bot-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      font-size: 0.65rem;
    }

    .bot-card .bname {
      color: var(--text);
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bot-card .bstatus {
      margin-top: 4px;
      padding: 2px 6px;
      border-radius: 2px;
      display: inline-block;
    }

    .bstatus.joining  { background: rgba(255,170,0,0.15); color: #ffaa00; }
    .bstatus.verifying{ background: rgba(0,204,255,0.15); color: var(--accent2); }
    .bstatus.online  { background: rgba(0,255,136,0.15); color: var(--accent); }
    .bstatus.kicked  { background: rgba(255,68,102,0.15); color: var(--red); }

    .tag {
      display: inline-block;
      font-size: 0.6rem;
      padding: 2px 6px;
      border-radius: 2px;
      background: rgba(0,204,255,0.1);
      color: var(--accent2);
      border: 1px solid rgba(0,204,255,0.2);
      margin-left: 8px;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<header>
  <div class="dot" id="wsDot"></div>
  <h1>⬛ MC BOT PANEL</h1>
  <span class="tag">SONAR BYPASS</span>
</header>

<div class="grid">

  <!-- LEFT: Controls -->
  <div>
    <div class="card" style="margin-bottom:16px">
      <h2>Hedef Sunucu</h2>

      <div class="row">
        <div class="field">
          <label>IP / Hostname</label>
          <input id="ip" type="text" value="mc.example.net" placeholder="mc.example.net"/>
        </div>
        <div class="field" style="max-width:90px">
          <label>Port</label>
          <input id="port" type="number" value="25570" min="1" max="65535"/>
        </div>
      </div>

      <div class="field">
        <label>MC Versiyonu</label>
        <select id="version">
          <option value="1.21.4">1.21.4</option>
          <option value="1.20.4">1.20.4</option>
          <option value="1.19.4">1.19.4</option>
          <option value="1.18.2">1.18.2</option>
          <option value="1.17.1">1.17.1</option>
          <option value="1.16.5">1.16.5</option>
          <option value="1.12.2">1.12.2</option>
          <option value="1.8.9" selected>1.8.9</option>
        </select>
      </div>

      <div class="field">
        <label>Username Prefix</label>
        <input id="prefix" type="text" value="Bot" placeholder="Bot"/>
      </div>

      <div class="field">
        <label>Auth Şifresi (AuthMe/nLogin bypass)</label>
        <input id="authPass" type="text" value="Bypass123!" placeholder="Bypass123!"/>
      </div>

      <div class="field">
        <label>Bot Sayısı: <span id="countLabel" style="color:var(--accent)">50</span></label>
        <div class="slider-wrap">
          <input type="range" id="count" min="1" max="500" value="50"
            oninput="document.getElementById('countLabel').textContent=this.value"/>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <h2>Sonar Bypass Ayarları</h2>

      <div class="field">
        <label>Join Delay (ms) — Bot başına bekleme</label>
        <input id="joinDelay" type="number" value="800" min="100" max="10000"/>
      </div>

      <div class="field">
        <label>Rejoin Delay (ms) — Kick sonrası tekrar bağlanma</label>
        <input id="rejoinDelay" type="number" value="3000" min="500" max="30000"/>
      </div>

      <div class="field">
        <label>Bypass Modu</label>
        <select id="bypassMode">
          <option value="gravity">Gravity Sim (Sonar Standard)</option>
          <option value="chat">Chat Verify (/verify)</option>
          <option value="both">Gravity + Chat</option>
        </select>
      </div>

      <div class="field">
        <label>Proxy Dosyası (opsiyonel, server.js tarafında)</label>
        <input id="proxyFile" type="text" value="proxies.txt" placeholder="proxies.txt"/>
      </div>
    </div>

    <button class="btn btn-start" id="startBtn" onclick="startAttack()">▶ BAŞLAT</button>
    <button class="btn btn-stop"  id="stopBtn"  onclick="stopAttack()" disabled>■ DURDUR</button>

    <div class="card" style="margin-top:16px">
      <h2>Proxy Durumu</h2>
      <div class="stats" style="grid-template-columns:repeat(3,1fr); margin-bottom:12px">
        <div class="stat">
          <span class="stat-num" id="pxTotal" style="color:var(--text)">—</span>
          <span class="stat-label">Toplam</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="pxActive">—</span>
          <span class="stat-label">Aktif</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="pxBanned" style="color:var(--red)">—</span>
          <span class="stat-label">Banlı</span>
        </div>
      </div>
      <button class="btn" style="background:transparent;border:1px solid var(--accent2);color:var(--accent2);margin-bottom:6px"
        onclick="send({type:'proxy_stats'})">↻ Durumu Güncelle</button>
      <button class="btn" style="background:transparent;border:1px solid var(--muted);color:var(--muted);margin-bottom:6px"
        onclick="send({type:'proxy_check'})">⚡ Health Check Başlat</button>
      <button class="btn" style="background:transparent;border:1px solid var(--red);color:var(--red)"
        onclick="send({type:'proxy_reset'})">✕ Ban Listesini Temizle</button>
    </div>
  </div>

  <!-- RIGHT: Status -->
  <div>
    <div class="card" style="margin-bottom:16px">
      <h2>Anlık Durum</h2>
      <div class="stats">
        <div class="stat">
          <span class="stat-num" id="statOnline">0</span>
          <span class="stat-label">Online</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="statJoining" style="color:var(--accent2)">0</span>
          <span class="stat-label">Joining</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="statKicked" style="color:var(--red)">0</span>
          <span class="stat-label">Kicked</span>
        </div>
      </div>
      <div class="bot-grid" id="botGrid"></div>
    </div>

    <div class="card">
      <h2>Konsol</h2>
      <div class="console" id="console"></div>
    </div>
  </div>
</div>

<script>
  let ws = null;
  let bots = {};

  function log(msg, type = 'muted') {
    const c = document.getElementById('console');
    const ts = new Date().toLocaleTimeString('tr-TR');
    const div = document.createElement('div');
    div.className = `log-line ${type}`;
    div.textContent = `[${ts}] ${msg}`;
    c.appendChild(div);
    c.scrollTop = c.scrollHeight;
  }

  function connectWS() {
    const wsHost = window.location.hostname || 'localhost';
    const wsPort = 3000;
    ws = new WebSocket(`ws://${wsHost}:${wsPort}`);

    ws.onopen = () => {
      document.getElementById('wsDot').className = 'dot connected';
      log('Backend bağlantısı kuruldu.', 'success');
    };

    ws.onclose = () => {
      document.getElementById('wsDot').className = 'dot';
      log('Backend bağlantısı kesildi. 3s sonra yeniden deneniyor...', 'warn');
      setTimeout(connectWS, 3000);
    };

    ws.onerror = () => log('WebSocket hatası.', 'error');

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      handleMsg(msg);
    };
  }

  function handleMsg(msg) {
    switch (msg.type) {
      case 'bot_status':
        bots[msg.name] = msg.status;
        renderBotGrid();
        updateStats();
        log(`${msg.name} → ${msg.status}${msg.detail ? ' | ' + msg.detail : ''}`,
          msg.status === 'online' ? 'success' :
          msg.status === 'kicked' ? 'error' :
          msg.status === 'verifying' ? 'info' : 'muted');
        break;
      case 'log':
        log(msg.text, msg.level || 'muted');
        break;
      case 'proxy_stats':
        document.getElementById('pxTotal').textContent  = msg.stats.total;
        document.getElementById('pxActive').textContent = msg.stats.active;
        document.getElementById('pxBanned').textContent = msg.stats.banned;
        break;
      case 'clear':
        bots = {};
        renderBotGrid();
        updateStats();
        break;
    }
  }

  function renderBotGrid() {
    const grid = document.getElementById('botGrid');
    grid.innerHTML = '';
    for (const [name, status] of Object.entries(bots)) {
      const card = document.createElement('div');
      card.className = 'bot-card';
      card.innerHTML = `<div class="bname">${name}</div>
        <span class="bstatus ${status}">${status}</span>`;
      grid.appendChild(card);
    }
  }

  function updateStats() {
    const vals = Object.values(bots);
    document.getElementById('statOnline').textContent  = vals.filter(s => s === 'online').length;
    document.getElementById('statJoining').textContent = vals.filter(s => s === 'joining' || s === 'verifying').length;
    document.getElementById('statKicked').textContent  = vals.filter(s => s === 'kicked').length;
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify(obj));
    else
      log('Backend bağlı değil!', 'error');
  }

  function startAttack() {
    const cfg = {
      type:        'start',
      ip:          document.getElementById('ip').value.trim(),
      port:        parseInt(document.getElementById('port').value),
      version:     document.getElementById('version').value,
      prefix:      document.getElementById('prefix').value.trim() || 'Bot',
      count:       parseInt(document.getElementById('count').value),
      joinDelay:   parseInt(document.getElementById('joinDelay').value),
      rejoinDelay: parseInt(document.getElementById('rejoinDelay').value),
      bypassMode:  document.getElementById('bypassMode').value,
      proxyFile:   document.getElementById('proxyFile').value.trim(),
      authPass:    document.getElementById('authPass').value.trim() || 'Bypass123!',
    };

    bots = {};
    renderBotGrid();
    updateStats();

    send(cfg);
    log(`Saldırı başlatılıyor → ${cfg.ip}:${cfg.port} | ${cfg.count} bot | bypass: ${cfg.bypassMode}`, 'info');
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled  = false;
  }

  function stopAttack() {
    send({ type: 'stop' });
    log('Durdurma komutu gönderildi.', 'warn');
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled  = true;
  }

  connectWS();
</script>
</body>
</html>
